server:
  port: 8081

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/user_db
    username: ${DB_USERNAME:movieticket}
    password: ${DB_PASSWORD:movieticket}
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:movieticket}
    password: ${RABBITMQ_PASSWORD:movieticket}

jwt:
  secret: ${JWT_SECRET:change-me-in-production-please-use-at-least-32-bytes-long-secret-key}
  expires-in-seconds: ${JWT_EXPIRES_IN_SECONDS:3600}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.movieticket: INFO
    org.springframework.amqp: WARN
